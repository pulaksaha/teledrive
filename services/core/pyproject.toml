[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Fail on warnings from our own code (not dependencies).
filterwarnings = [
    "error::DeprecationWarning:pulakdrive",
    "error::UserWarning:pulakdrive",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["pulakdrive"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "S",    # bandit (security)
]
ignore = [
    "S101",  # allow assert in tests
    "B008",  # FastAPI Depends() pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S105"]  # allow assert + synthetic credentials in tests

[tool.ruff.lint.isort]
known-first-party = ["pulakdrive"]

[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulakdrive"
version = "0.1.0"
description = "PulakDrive core service — Phase 1"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
]

